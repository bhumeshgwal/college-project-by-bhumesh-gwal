    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --saffron: #f26522;
            --black: #0f0f0f;
            --cursor-green: #00ff41;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: auto;
            cursor: none;
        }

        .syncopate { font-family: 'Syncopate', sans-serif; }

        /* CURSOR */
        #cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #16eb0b, var(--cursor-green) 80%);
            border-radius: 50%;
            pointer-events:none;
            z-index: 10000;
            box-shadow: 0 5px 15px rgba(28, 255, 84, 0.4);
            transform: translate(-50%, -50%);
            transition: background 0.3s ease;
        }

        #cursor.hover {
            background: radial-gradient(circle at 30% 30%, #ffb8a2, var(--saffron) 80%);
            box-shadow: 2px 5px 15px rgba(183, 78, 29, 0.4);
        }

        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--cursor-green);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.5;
        }

        .grain {
            position: fixed;
            inset: 0;
            z-index: 9998;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E");
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(20px);
            background: rgba(15, 15, 15, 0.85);
            border-bottom: 1px solid rgba(242, 101, 34, 0.1);
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.05em;
        }

        .logo-tagline {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--saffron);
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
            cursor: none;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--saffron);
        }

        .lang-btn {
            background: var(--saffron);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: none;
            transition: all 0.3s ease;
        }

        /* HERO */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            padding: 8rem 2rem 4rem;
        }

        .giant-title {
            position: absolute;
            font-size: 15vw;
            line-height: 0.8;
            color: var(--saffron);
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 900;
        }

        /* MODERN ORBIT CHAKRA STYLING */
        .ashok-chakra {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            opacity: 0.12; /* Increased slightly to show the glow better */
            z-index: 1;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 10px var(--saffron));
        }

        .ashok-chakra svg {
            width: 100%;
            height: 100%;
            overflow: visible !important;
            color: var(--saffron);
        }
        .hero-content {
            position: relative;
            z-index: 10;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            margin-bottom: 1.5rem;
            line-height: 1;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.6;
            margin-bottom: 3rem;
        }

        /* TIMELINE */
        .timeline-section {
            padding: 6rem 2rem;
            position: relative;
        }

        .timeline-container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .timeline-item {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-bottom: 8rem;
            align-items: center;
            opacity: 0;
        }

        .timeline-item.even {
            direction: rtl;
        }

        .timeline-item.even > * {
            direction: ltr;
        }

        .timeline-image {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(242, 101, 34, 0.2);
        }

        .timeline-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .timeline-content {
            padding: 2rem;
        }

        .timeline-year {
            display: inline-block;
            background: rgba(242, 101, 34, 0.1);
            color: var(--saffron);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .timeline-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: var(--saffron);
        }

        .timeline-desc {
            font-size: 1rem;
            line-height: 1.8;
            opacity: 0.8;
        }

        /* PORTRAIT STYLE */
        .timeline-item.portrait .timeline-image {
            aspect-ratio: 3/4;
            max-width: 400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .timeline-item {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .timeline-item.even {
                direction: ltr;
            }

            .nav-links {
                display: none;
            }
        }

        footer {
            padding: 3rem 2rem;
            text-align: center;
            background: var(--black);
            border-top: 1px solid rgba(242, 101, 34, 0.1);
            opacity: 0.5;
            font-size: 0.85rem;
        }
        /* THE ANOMALY */
        #anomaly-core {
            position: fixed;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: white;
            filter: blur(15px);
            mix-blend-mode: difference; /* This makes it change color based on background */
            z-index: 10002;
            pointer-events: none;
            box-shadow: 0 0 50px white, 0 0 100px var(--saffron);
            opacity: 0;
        }

        .anomaly-active {
            animation: pulse-energy 0.2s infinite alternate;
        }

        @keyframes pulse-energy {
            from { transform: translate(-50%, -50%) scale(1); filter: blur(15px); }
            to { transform: translate(-50%, -50%) scale(1.2); filter: blur(5px); }
        }
    </style>
</head>

            <circle cx="50" cy="50" r="56" fill="none" stroke="currentColor" stroke-width="0.2" stroke-dasharray="1 3" opacity="0.2" />

            <circle cx="50" cy="50" r="8" fill="currentColor" filter="url(#softGlow)"/>

            <g id="chakra-spokes" filter="url(#softGlow)">
                <script>
                    for (let i = 0; i < 24; i++) {

                                <line x1="50" y1="50" x2="50" y2="5" stroke="currentColor" stroke-width="0.6" opacity="0.6"/>
                                <path d="M50 38 L48.8 22 L50 5 L51.2 22 Z" fill="currentColor" />
                                <circle cx="50" cy="5" r="1.2" fill="currentColor" />
                            </g>
                        `);
                    }
                </script>
            </g>

            <g filter="url(#greenGlow)">

                        path="M 50,50 m -56,0 a 56,56 0 1,0 112,0 a 56,56 0 1,0 -112,0" />

            </g>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const portraitEvents = ["Meeting Sri Ramakrishna", "Western Mission & Teachings", "Final Days", "Mahasamadhi"];
        
        const timelineData = [
            { year: "1863", en_t: "Birth", hi_t: "जन्म", en_d: "Born as Narendranath Datta on 12 January 1863 in Calcutta. Raised in an educated, progressive family that encouraged rational thinking, spiritual inquiry, and exposure to both Western and Indian philosophical traditions.", hi_d: "12 जनवरी 1863 को कलकत्ता में नरेंद्रनाथ दत्त के रूप में जन्म। एक शिक्षित, प्रगतिशील परिवार में पालन-पोषण जो तर्कसंगत सोच, आध्यात्मिक जिज्ञासा और पश्चिमी और भारतीय दार्शनिक परंपराओं दोनों के संपर्क को प्रोत्साहित करता था।", img: "birthplace.png" },
            { year: "1871–1878", en_t: "Early Education", hi_t: "प्रारंभिक शिक्षा", en_d: "Displayed exceptional intelligence, photographic memory, and leadership qualities. Showed early inclination toward spiritual and philosophical questions, often challenging conventional religious beliefs. Excelled in academics, music, and athletics.", hi_d: "असाधारण बुद्धि, फोटोग्राफिक स्मृति और नेतृत्व गुणों का प्रदर्शन। आध्यात्मिक और दार्शनिक प्रश्नों की ओर प्रारंभिक झुकाव, अक्सर पारंपरिक धार्मिक मान्यताओं को चुनौती देते हुए। शिक्षा, संगीत और खेलकूद में उत्कृष्ट।", img: "Early education.jpg" },
            { year: "1879", en_t: "College Education", hi_t: "कॉलेज शिक्षा", en_d: "Enrolled at Presidency College, then Scottish Church College. Studied philosophy, logic, Western thought, and literature. Developed critical thinking and began questioning traditional religious dogma while maintaining spiritual curiosity.", hi_d: "प्रेसीडेंसी कॉलेज, फिर स्कॉटिश चर्च कॉलेज में दाखिला। दर्शनशास्त्र, तर्कशास्त्र, पश्चिमी विचार और साहित्य का अध्ययन। आलोचनात्मक सोच विकसित की और आध्यात्मिक जिज्ञासा बनाए रखते हुए पारंपरिक धार्मिक सिद्धांतों पर सवाल उठाने लगे।", img: "collegeSV.jpg" },
            { year: "1881", en_t: "Meeting Sri Ramakrishna", hi_t: "श्री रामकृष्ण से मिलन", en_d: "First meeting with Sri Ramakrishna Paramahamsa at Dakshineshwar Temple. Asked the famous question: 'Have you seen God?' This encounter marked a turning point, beginning the conflict between his rational skepticism and experiential spirituality.", hi_d: "दक्षिणेश्वर मंदिर में श्री रामकृष्ण परमहंस से पहली मुलाकात। प्रसिद्ध प्रश्न पूछा: 'क्या आपने भगवान को देखा है?' यह मुलाकात एक महत्वपूर्ण मोड़ था, जिसने उनके तर्कसंगत संदेह और अनुभवात्मक आध्यात्मिकता के बीच संघर्ष की शुरुआत की।", img: "ramkrishna.jpg" },
            { year: "1884", en_t: "Family Crisis", hi_t: "पारिवारिक संकट", en_d: "Father's sudden death left the family in severe financial distress. Struggled to find employment while supporting family members. This period of hardship intensified his search for spiritual truth and understanding of suffering.", hi_d: "पिता की आकस्मिक मृत्यु ने परिवार को गंभीर आर्थिक संकट में डाल दिया। परिवार के सदस्यों का समर्थन करते हुए रोजगार खोजने के लिए संघर्ष किया। कठिनाई की इस अवधि ने आध्यात्मिक सत्य और दुख की समझ की उनकी खोज को तीव्र कर दिया।", img: "familycrysis.jpg" },
            { year: "1885–1886", en_t: "Discipleship & Loss", hi_t: "शिष्यत्व और खोया", en_d: "Devoted himself to selfless service during Sri Ramakrishna's terminal illness. Witnessed his guru's Mahasamadhi on 16 August 1886. This profound loss strengthened his spiritual conviction and commitment to his master's teachings.", hi_d: "श्री रामकृष्ण की अंतिम बीमारी के दौरान निस्वार्थ सेवा के लिए खुद को समर्पित कर दिया। 16 अगस्त 1886 को अपने गुरु की महासमाधि देखी। इस गहन क्षति ने उनके आध्यात्मिक विश्वास और अपने गुरु की शिक्षाओं के प्रति प्रतिबद्धता को मजबूत किया।", img: "Discipleship1.jpg" },
            { year: "1886", en_t: "Monastic Vows", hi_t: "संन्यास की शपथ", en_d: "Formally accepted monastic life and took the name Swami Vivekananda. Along with fellow disciples, established the first monastery at Baranagar. Committed himself fully to renunciation, meditation, and spiritual practice.", hi_d: "औपचारिक रूप से संन्यासी जीवन स्वीकार किया और स्वामी विवेकानंद नाम धारण किया। साथी शिष्यों के साथ, बड़ानगर में पहला मठ स्थापित किया। त्याग, ध्यान और आध्यात्मिक अभ्यास के लिए खुद को पूरी तरह से प्रतिबद्ध किया।", img: "sanyaas.jpg" },
            { year: "1888–1892", en_t: "Wandering Monk Period", hi_t: "परिव्राजक काल", en_d: "Traveled extensively across India on foot for nearly five years. Witnessed extreme poverty, caste discrimination, and social inequality. This journey transformed his understanding of spirituality from individual salvation to collective upliftment.", hi_d: "लगभग पांच वर्षों तक पैदल पूरे भारत की व्यापक यात्रा की। अत्यधिक गरीबी, जाति भेदभाव और सामाजिक असमानता देखी। इस यात्रा ने आध्यात्मिकता की उनकी समझ को व्यक्तिगत मोक्ष से सामूहिक उत्थान में बदल दिया।", img: "Wanderingmonk.jpg" },
            { year: "1892", en_t: "Kanyakumari Meditation", hi_t: "कन्याकुमारी ध्यान", en_d: "At the southern tip of India, meditated for three days on a rock. Had a profound vision of India's past glory and future potential. Conceived the idea of attending the Parliament of Religions.", hi_d: "भारत के दक्षिणी छोर पर, एक चट्टान पर तीन दिनों तक ध्यान किया। भारत की पिछली महिमा और भविष्य की क्षमता का एक गहन दर्शन हुआ।", img: "kanyakumari.jpg" },
            { year: "1893", en_t: "Parliament of World's Religions", hi_t: "विश्व धर्म संसद", en_d: "Represented Hinduism at Chicago's Parliament of Religions (11-27 September 1893). Famous opening address: 'Sisters and Brothers of America.' His speeches captivated audiences and established him as a major global spiritual voice.", hi_d: "शिकागो की धर्म संसद में हिंदू धर्म का प्रतिनिधित्व किया (11-27 सितंबर 1893)। प्रसिद्ध उद्घाटन संबोधन: 'अमेरिका के बहनों और भाइयों।'", img: "Parliment of religion.jpg" },
            { year: "1893–1896", en_t: "Western Mission & Teachings", hi_t: "पश्चिमी मिशन और शिक्षण", en_d: "Lectured extensively across United States and Europe for nearly three years. Founded Vedanta societies in New York and other cities. Published 'Raja Yoga' explaining meditation systematically.", hi_d: "लगभग तीन वर्षों तक संयुक्त राज्य अमेरिका और यूरोप में व्यापक रूप से व्याख्यान दिए। न्यूयॉर्क और अन्य शहरों में वेदांत समाजों की स्थापना की।", img: "western mission.jpg" },
            { year: "1897", en_t: "Triumphant Return to India", hi_t: "भारत में विजयी वापसी", en_d: "Returned to India to a hero's welcome. Delivered powerful lectures in major cities inspiring national pride and self-confidence.", hi_d: "भारत लौटे तो एक नायक के स्वागत का सामना किया। प्रमुख शहरों में शक्तिशाली व्याख्यान दिए।", img: "return in india.jpg" },
            { year: "1897", en_t: "Founding of Ramakrishna Mission", hi_t: "रामकृष्ण मिशन की स्थापना", en_d: "Established Ramakrishna Mission on 1 May 1897 at Baranagar. Created to combine spiritual practice with social service, education, healthcare, and disaster relief.", hi_d: "1 मई 1897 को बड़ानगर में रामकृष्ण मिशन की स्थापना की।", img: "foundation of rkmission.jpg" },
            { year: "1898", en_t: "Belur Math Established", hi_t: "बेलूर मठ की स्थापना", en_d: "Established permanent headquarters at Belur Math on the banks of River Ganges near Calcutta.", hi_d: "कलकत्ता के पास गंगा नदी के तट पर बेलूर मठ में स्थायी मुख्यालय स्थापित किया।", img: "foundation of ramkrishna1.jpg" },
            { year: "1899–1900", en_t: "Second Western Visit", hi_t: "दूसरी पश्चिमी यात्रा", en_d: "Undertook second journey to the West despite declining health. Visited California, attended Congress of History of Religions in Paris.", hi_d: "गिरते स्वास्थ्य के बावजूद पश्चिम की दूसरी यात्रा की।", img: "secondwestvisit.jpg" },
            { year: "1901–1902", en_t: "Final Days", hi_t: "अंतिम दिन", en_d: "Returned to India in deteriorating health. Despite illness, continued guiding disciples and planning Mission activities.", hi_d: "बिगड़ती सेहत में भारत लौटे।", img: "final days.jpg" },
            { year: "1902", en_t: "Mahasamadhi", hi_t: "महासमाधि", en_d: "On 4 July 1902, at age 39, attained Mahasamadhi at Belur Math. His teachings continue to guide spiritual seekers worldwide.", hi_d: "4 जुलाई 1902 को, 39 वर्ष की आयु में, बेलूर मठ में महासमाधि प्राप्त की।", img: "mahasamadhi.jpg" }
        ];

        let currentLang = 'en';

        const content = {
            "en": {
                "nav-logo": "VIVEKANANDA",
                "nav-tagline": "Authentic Archive",
                "nav-home": "Home",
                "nav-life": "Life",
                "nav-teachings": "Teachings",
                "nav-works": "Works",
                "nav-legacy": "Legacy",
                "nav-quotes": "Quotes",
                "nav-about": "About",
                "hero-title": "Life & Timeline",
                "hero-subtitle": "1863 – 1902 | The path of a wandering monk",
                "footer-text": "© 2024 Swami Vivekananda Archive - Factual & Authentic Reference"
            },
            "hi": {
                "nav-logo": "विवेकानंद",
                "nav-tagline": "प्रामाणिक संग्रहालय",
                "nav-home": "होम",
                "nav-life": "जीवन",
                "nav-teachings": "शिक्षाएं",
                "nav-works": "कृतियां",
                "nav-legacy": "विरासत",
                "nav-quotes": "अनमोल वचन",
                "nav-about": "हमारे बारे में",
                "hero-title": "जीवन और कालक्रम",
                "hero-subtitle": "1863 – 1902 | एक परिव्राजक का मार्ग",
                "footer-text": "© 2024 स्वामी विवेकानंद आर्काइव - तथ्यात्मक और प्रामाणिक संदर्भ"
            }
        };

        function isPortraitEvent(title) {
            return portraitEvents.includes(title);
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            timelineData.forEach((item, index) => {
                const isEven = index % 2 === 0;
                const isPortrait = isPortraitEvent(item.en_t);
                const portraitClass = isPortrait ? 'portrait' : '';

                const html = `
                    <div class="timeline-item ${isEven ? 'even' : 'odd'} ${portraitClass}" data-index="${index}">
                        <div class="timeline-image">
                            <img src="${item.img}" alt="${currentLang === 'en' ? item.en_t : item.hi_t}" 
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 300%22%3E%3Crect fill=%22%23222%22 width=%22400%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2214%22%3E${item.img}%3C/text%3E%3C/svg%3E'">
                        </div>
                        <div class="timeline-content">
                            <span class="timeline-year">${item.year}</span>
                            <h3 class="timeline-title">${currentLang === 'en' ? item.en_t : item.hi_t}</h3>
                            <p class="timeline-desc">${currentLang === 'en' ? item.en_d : item.hi_d}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });

            animateTimeline();
        }

        function animateTimeline() {
            gsap.utils.toArray('.timeline-item').forEach((item, index) => {
                const isEven = index % 2 === 0;
                const image = item.querySelector('.timeline-image');
                const content = item.querySelector('.timeline-content');

                // Image slides from RIGHT (odd) or LEFT (even)
                gsap.fromTo(image, 
                    {
                        x: isEven ? -200 : 200,
                        opacity: 0,
                        scale: 0.8
                    },
                    {
                        x: 0,
                        opacity: 1,
                        scale: 1,
                        duration: 1.2,
                        ease: 'power3.out',
                        scrollTrigger: {
                            trigger: item,
                            start: 'top 80%',
                            end: 'top 30%',
                            toggleActions: 'play none none reverse'
                        }
                    }
                );

                // Content fades in with slight slide
                gsap.fromTo(content,
                    {
                        opacity: 0,
                        y: 50
                    },
                    {
                        opacity: 1,
                        y: 0,
                        duration: 1,
                        delay: 0.3,
                        ease: 'power2.out',
                        scrollTrigger: {
                            trigger: item,
                            start: 'top 75%',
                            toggleActions: 'play none none reverse'
                        }
                    }
                );

                // Item container fade
                gsap.to(item, {
                    opacity: 1,
                    duration: 0.1,
                    scrollTrigger: {
                        trigger: item,
                        start: 'top 85%'
                    }
                });
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (content[currentLang][key]) {
                    el.innerText = content[currentLang][key];
                }
            });
            document.getElementById('langBtn').innerText = currentLang === 'en' ? 'हिन्दी' : 'English';
            renderTimeline();
        }
        const anomaly = document.getElementById('anomaly-core');
        let anomalyActive = false;
        let aPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let aTarget = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        // Anomaly behavior: Satifying "Magnetic" drag
        function updateAnomaly() {
            // High tension spring physics
            aPos.x += (aTarget.x - aPos.x) * 0.08;
            aPos.y += (aTarget.y - aPos.y) * 0.08;
            
            gsap.set(anomaly, { x: aPos.x, y: aPos.y });
            requestAnimationFrame(updateAnomaly);
        }
        updateAnomaly();

        // Trigger: Surprise focus when mouse gets near the center of the Chakra
        window.addEventListener('mousemove', (e) => {
            const chakra = document.getElementById('chakra');
            const rect = chakra.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const dist = Math.hypot(e.clientX - centerX, e.clientY - centerY);

            if (dist < 100 && !anomalyActive) {
                // SURPRISE TRIGGER
                anomalyActive = true;
                gsap.to(anomaly, { width: 60, height: 60, opacity: 0.8, duration: 0.5, ease: "back.out(2)" });
                anomaly.classList.add('anomaly-active');
                        
                // REMOVED: Don't hide cursor
                // gsap.to('#cursor', { opacity: 0, duration: 0.2 });
            }

            if (anomalyActive) {
                aTarget.x = e.clientX;
                aTarget.y = e.clientY;

                // Satisfying effect: If moving fast, stretch the anomaly
                const speed = Math.hypot(e.movementX, e.movementY);
                gsap.to(anomaly, { 
                    scaleX: 1 + (speed / 20), 
                    scaleY: 1 - (speed / 40),
                    rotation: Math.atan2(e.movementY, e.movementX) * 180 / Math.PI,
                    duration: 0.2 
                });

                // Escape mechanism: Snap back if moved too far from Chakra or fast shake
                if (dist > 400) {
                    anomalyActive = false;
                    gsap.to(anomaly, { width: 0, height: 0, opacity: 1, duration: 0.4 });
                }
            }
        });

        // Add satisfying "Absorption" when clicking
        window.addEventListener('mousedown', () => {
            if (anomalyActive) {
                gsap.to(anomaly, { scale: 0.5, filter: "blur(0px)", boxShadow: "0 0 100px 50px white", duration: 0.1 });
            }
        });
        window.addEventListener('mouseup', () => {
            if (anomalyActive) {
                gsap.to(anomaly, { scale: 1, filter: "blur(15px)", boxShadow: "0 0 50px white", duration: 0.3 });
            }
        });
        // CURSOR
        const cursor = document.querySelector('#cursor');
        let mouseX = 0, mouseY = 0, lastX = 0, lastY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            gsap.to(cursor, { x: mouseX, y: mouseY, duration: 0.1 });

            const dx = mouseX - lastX;
            const dy = mouseY - lastY;

            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                const p = document.createElement('div');
                p.className = 'particle';
                document.body.appendChild(p);
                gsap.set(p, { x: mouseX, y: mouseY, scale: gsap.utils.random(0.5, 1) });
                gsap.to(p, {
                    x: mouseX - (dx * 2),
                    y: mouseY - (dy * 2),
                    opacity: 0,
                    scale: 0,
                    duration: 0.6,
                    onComplete: () => p.remove()
                });
            }

            lastX = mouseX;
            lastY = mouseY;
        });

        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });
// Make the orbiting green ball breathe/pulse
        gsap.to('.ashok-chakra circle[fill*="var(--cursor-green)"]', {
            r: 4.5,
            duration: 2,
            repeat: 1,
            yoyo: true,
            ease: "sine.inOut"
        });
        // PARALLAX ON GIANT TITLE
        gsap.to('.giant-title', {
            scrollTrigger: {
                trigger: '.hero-section',
                start: 'top top',
                end: 'bottom top',
                scrub: 1
            },
            xPercent: -15,
            ease: 'none'
        });

        renderTimeline();
    </script>
