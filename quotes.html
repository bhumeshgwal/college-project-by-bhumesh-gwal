<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अनमोल वचन | स्वामी विवेकानंद</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        :root { --saffron: #f26522; --black: #0f0f0f; --cursor-green: #1ed54c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; cursor: none; }
        .syncopate { font-family: 'Syncopate', sans-serif; }
        .page-transition { position: fixed; inset: 0; background: var(--black); z-index: 10001; pointer-events: none; opacity: 0; }
        #cursor { position: fixed; width: 12px; height: 12px; background: radial-gradient(circle at 30% 30%, #a2ffb8, var(--cursor-green) 80%); border-radius: 50%; pointer-events: none; z-index: 10000; box-shadow: 0 5px 15px rgba(0, 255, 65, 0.4); transform: translate(-50%, -50%); transition: background 0.3s ease; }
        #cursor.hover { background: radial-gradient(circle at 30% 30%, #ffb8a2, var(--saffron) 80%); box-shadow: 0 5px 15px rgba(242, 101, 34, 0.4); }
        .grain { position: fixed; inset: 0; z-index: 9998; opacity: 0.03; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E"); }
        nav { position: fixed; top: 0; width: 100%; z-index: 1000; backdrop-filter: blur(20px); background: rgba(15, 15, 15, 0.85); border-bottom: 1px solid rgba(242, 101, 34, 0.1); }
        .nav-content { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo-section { display: flex; flex-direction: column; }
        .logo-text { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.05em; }
        .logo-tagline { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.3em; color: var(--saffron); font-weight: 700; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s ease; cursor: none; }
        .nav-links a:hover, .nav-links a.active { color: var(--saffron); }
        .lang-btn { background: var(--saffron); color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 50px; font-weight: 700; font-size: 0.85rem; cursor: none; }
        .ashok-chakra { position: fixed; top: 50%; left: 50%; width: 50vw; height: 50vw; max-width: 600px; max-height: 600px; opacity: 0.06; z-index: 1; pointer-events: none; transform: translate(-50%, -50%); }
        .ashok-chakra svg { width: 100%; height: 100%; }
        .chakra-circle { fill: none; stroke: var(--saffron); stroke-width: 1; }
        .chakra-center { fill: var(--saffron); }
        .chakra-spoke { stroke: var(--saffron); stroke-width: 1.5; stroke-linecap: round; opacity: 0.8; }
        .hero-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; padding: 8rem 2rem 4rem; }
        .giant-title { position: absolute; font-size: 15vw; line-height: 0.8; color: var(--saffron); opacity: 0.03; z-index: 0; pointer-events: none; font-weight: 900; }
        .hero-content { position: relative; z-index: 10; max-width: 900px; }
        .hero-title { font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; margin-bottom: 2rem; line-height: 1; }
        .hero-desc { font-size: 1.2rem; opacity: 0.7; line-height: 1.8; font-weight: 300; }
        .content-section { padding: 6rem 2rem; }
        .content-container { max-width: 1200px; margin: 0 auto; }
        .quote-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-left: 5px solid var(--saffron); border-radius: 12px; padding: 2.5rem; margin-bottom: 3rem; transition: all 0.3s ease; }
        .quote-card:hover { transform: translateX(10px); background: rgba(255, 255, 255, 0.05); }
        .quote-text { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.6; }
        .quote-context { font-size: 0.85rem; opacity: 0.5; font-style: italic; margin-bottom: 1.5rem; }
        .quote-explanation { border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.5rem; font-size: 0.95rem; opacity: 0.8; line-height: 1.8; }
        .explanation-label { color: var(--saffron); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 0.75rem; display: block; }
        footer { padding: 3rem 2rem; text-align: center; border-top: 1px solid rgba(242, 101, 34, 0.1); opacity: 0.5; font-size: 0.85rem; }
        @media (max-width: 768px) { .nav-links { display: none; } }
    </style>
</head>
<body>
    <div class="page-transition" id="pageTransition"></div>
    <div class="grain"></div>
    <div id="cursor"></div>
    <div class="ashok-chakra" id="chakra"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" class="chakra-circle"/><circle cx="50" cy="50" r="8" class="chakra-center"/><g id="spokes"><line x1="50" y1="50" x2="50" y2="10" class="chakra-spoke"/><line x1="50" y1="50" x2="59" y2="11" class="chakra-spoke"/><line x1="50" y1="50" x2="68" y2="14" class="chakra-spoke"/><line x1="50" y1="50" x2="76" y2="19" class="chakra-spoke"/><line x1="50" y1="50" x2="82" y2="26" class="chakra-spoke"/><line x1="50" y1="50" x2="87" y2="34" class="chakra-spoke"/><line x1="50" y1="50" x2="90" y2="43" class="chakra-spoke"/><line x1="50" y1="50" x2="90" y2="50" class="chakra-spoke"/><line x1="50" y1="50" x2="90" y2="57" class="chakra-spoke"/><line x1="50" y1="50" x2="87" y2="66" class="chakra-spoke"/><line x1="50" y1="50" x2="82" y2="74" class="chakra-spoke"/><line x1="50" y1="50" x2="76" y2="81" class="chakra-spoke"/><line x1="50" y1="50" x2="68" y2="86" class="chakra-spoke"/><line x1="50" y1="50" x2="59" y2="89" class="chakra-spoke"/><line x1="50" y1="50" x2="50" y2="90" class="chakra-spoke"/><line x1="50" y1="50" x2="41" y2="89" class="chakra-spoke"/><line x1="50" y1="50" x2="32" y2="86" class="chakra-spoke"/><line x1="50" y1="50" x2="24" y2="81" class="chakra-spoke"/><line x1="50" y1="50" x2="18" y2="74" class="chakra-spoke"/><line x1="50" y1="50" x2="13" y2="66" class="chakra-spoke"/><line x1="50" y1="50" x2="10" y2="57" class="chakra-spoke"/><line x1="50" y1="50" x2="10" y2="50" class="chakra-spoke"/><line x1="50" y1="50" x2="10" y2="43" class="chakra-spoke"/><line x1="50" y1="50" x2="13" y2="34" class="chakra-spoke"/><line x1="50" y1="50" x2="18" y2="26" class="chakra-spoke"/><line x1="50" y1="50" x2="24" y2="19" class="chakra-spoke"/><line x1="50" y1="50" x2="32" y2="14" class="chakra-spoke"/><line x1="50" y1="50" x2="41" y2="11" class="chakra-spoke"/></g></svg></div>
    <nav><div class="nav-content"><div class="logo-section"><span class="logo-text syncopate">विवेकानंद</span><span class="logo-tagline syncopate">प्रामाणिक संग्रहालय</span></div><div class="nav-links"><a href="index.html">होम</a><a href="timeline.html">जीवन</a><a href="teachings.html">शिक्षाएं</a><a href="works.html">कृतियां</a><a href="legacy.html">विरासत</a><a href="quotes.html" class="active">अनमोल वचन</a><a href="about.html">हमारे बारे में</a></div><a href="index.html" class="lang-btn">English</a></div></nav>
    <section class="hero-section"><div class="giant-title syncopate">WISDOM</div><div class="hero-content"><h1 class="hero-title syncopate">अनमोल <span style="color: var(--saffron);">वचन</span></h1><p class="hero-desc">स्वामी विवेकानंद के प्रेरक विचारों और उनके गहरे अर्थों का विस्तृत संग्रह</p></div></section>
    <section class="content-section"><div class="content-container" id="quotesContainer"></div></section>
    <footer><p>© 2024 स्वामी विवेकानंद आर्काइव - तथ्यात्मक और प्रामाणिक संदर्भ</p></footer>
    <script>
        gsap.registerPlugin(ScrollTrigger);
        const quotesData = [{q:"उठो, जागो और तब तक मत रुको जब तक लक्ष्य प्राप्त न हो जाए।",e:"यह स्वामी विवेकानंद का सबसे प्रसिद्ध संदेश है। 'उठो' का अर्थ है आलस्य को त्यागना। 'जागो' का अर्थ है अपनी क्षमता के प्रति जागरूक होना। यह आत्मिक जागरूकता है। दृढ़ता और निरंतर प्रयास के साथ लक्ष्य की ओर बढ़ना ही जीवन का अर्थ है।",context:"कठोपनिषद से प्रेरित"},{q:"शक्ति ही जीवन है, दुर्बलता ही मृत्यु है।",e:"यहाँ 'शक्ति' का अर्थ केवल शारीरिक बल नहीं है, बल्कि मानसिक दृढ़ता, नैतिक साहस और चारित्रिक मजबूती है। दुर्बलता मनुष्य को अंदर से खोखला कर देती है। विवेकानंद मानते थे कि भारत की समस्याओं की जड़ कमजोरी है।",context:"युवाओं को संबोधित"},{q:"तुम्हें अपने भीतर से विकसित होना होगा। कोई तुम्हें सिखा नहीं सकता।",e:"सच्चा ज्ञान बाहरी स्रोतों से नहीं आता। यह आत्म-अनुभव से आता है। गुरु केवल मार्ग दिखा सकते हैं। प्रत्येक व्यक्ति के भीतर असीम ज्ञान पहले से मौजूद है। यह आत्म-सशक्तिकरण का संदेश है।",context:"राज योग में"},{q:"संसार की सारी शक्तियाँ पहले से हमारे भीतर हैं।",e:"यह वेदांत के मूल सिद्धांत को दर्शाता है। हम पहले से ही पूर्ण हैं। समस्या यह है कि हम उन्हें पहचानते नहीं। अज्ञानता हमें अपनी वास्तविक प्रकृति से दूर रखती है।",context:"अमेरिका में व्याख्यान"},{q:"मनुष्य की सेवा को ही ईश्वर की सेवा समझो।",e:"यह 'प्रैक्टिकल वेदांत' का आधार है। ईश्वर प्रत्येक जीवित प्राणी में है। दुखी मानवता में ईश्वर की सबसे स्पष्ट उपस्थिति है। भूखों को खाना देना, बीमारों की सेवा करना ईश्वर की प्रत्यक्ष सेवा है।",context:"रामकृष्ण मिशन का सिद्धांत"}];
        function renderQuotes(){const c=document.getElementById('quotesContainer');c.innerHTML='';quotesData.forEach((item,i)=>{c.innerHTML+=`<div class="quote-card"><div class="d-flex align-items-start mb-4"><div class="text-orange text-3xl mr-4"><i class="fa-solid fa-quote-left"></i></div><div class="flex-1"><h2 class="quote-text">${item.q}</h2>${item.context?`<p class="quote-context">संदर्भ: ${item.context}</p>`:''}</div></div><div class="quote-explanation"><span class="explanation-label">विस्तृत व्याख्या</span><p>${item.e}</p></div></div>`;});animateQuotes();}
        function animateQuotes(){gsap.utils.toArray('.quote-card').forEach((card,i)=>{gsap.from(card,{scrollTrigger:{trigger:card,start:'top 85%'},y:60,opacity:0,duration:0.8,delay:i*0.1,ease:'power2.out'});});}
        const cursor=document.querySelector('#cursor');let mouseX=0,mouseY=0,lastX=0,lastY=0;window.addEventListener('mousemove',(e)=>{mouseX=e.clientX;mouseY=e.clientY;gsap.to(cursor,{x:mouseX,y:mouseY,duration:0.1});const dx=mouseX-lastX,dy=mouseY-lastY;if(Math.abs(dx)>2||Math.abs(dy)>2){const p=document.createElement('div');p.className='particle';document.body.appendChild(p);gsap.set(p,{x:mouseX,y:mouseY,scale:gsap.utils.random(0.5,1)});gsap.to(p,{x:mouseX-(dx*2),y:mouseY-(dy*2),opacity:0,scale:0,duration:0.6,onComplete:()=>p.remove()});}lastX=mouseX;lastY=mouseY;});document.querySelectorAll('a, button').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));});
        gsap.to('#chakra svg',{scrollTrigger:{trigger:'body',start:'top top',end:'bottom bottom',scrub:1},rotation:360*2,ease:'none'});gsap.utils.toArray('.chakra-spoke').forEach((spoke,i)=>{gsap.to(spoke,{scrollTrigger:{trigger:'body',start:'top top',end:'bottom bottom',scrub:2},opacity:0.3+(Math.sin(i*0.5)*0.5),attr:{x2:(i%2===0)?'+=3':'-=3',y2:(i%3===0)?'+=3':'-=3'},ease:'sine.inOut'});});gsap.to('.chakra-center',{scale:1.2,opacity:0.5,duration:2,repeat:-1,yoyo:true,ease:'sine.inOut',transformOrigin:'center'});gsap.to('.giant-title',{scrollTrigger:{trigger:'.hero-section',start:'top top',end:'bottom top',scrub:1},xPercent:-15,ease:'none'});
        function initPageTransition(){const t=document.getElementById('pageTransition');gsap.from(t,{opacity:1,duration:0.5,ease:'power2.out'});document.querySelectorAll('a[href]').forEach(link=>{link.addEventListener('click',(e)=>{if(link.href.includes('.html')&&!e.ctrlKey&&!e.metaKey){e.preventDefault();gsap.to(t,{opacity:1,duration:0.3,ease:'power2.in',onComplete:()=>{window.location.href=link.href;}});}});});}
        initPageTransition();renderQuotes();
    </script>
</body>
</html>
